[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "contourgauge"
version = "0.1.0"
description = "Replayable validated zero counts with local exponential gauges"
requires-python = ">=3.9"
dependencies = ["python-flint==0.6.0", "numpy==2.0.2", "scipy==1.13.1"]

[tool.setuptools.packages.find]
where = ["src"]
